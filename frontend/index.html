<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torneo Interfacultades F5 · UCU</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23fff%22 stroke=%22%2314211b%22 stroke-width=%222%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%2314211b%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card" novalidate>
      <div class="brand big"><span class="ball"></span>Torneo Interfacultades <b>F5</b></div>
      <p class="muted">Universidad Católica del Uruguay · Área de Deportes</p>
      <label>Correo <input name="correo" type="email" required autocomplete="username" placeholder="admin@ucu.edu.uy"></label>
      <label>Contraseña <input name="contrasena" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Ingresar</button>
      <p class="error" id="login-error"></p>
    </form>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <header class="top">
      <div class="brand"><span class="ball"></span>Interfacultades <b>F5</b></div>
      <label class="torneo-sel">Edición <select id="torneo-actual"></select></label>
      <div class="user"><span id="user-info"></span><button class="btn ghost sm" id="logout">Salir</button></div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="view" class="view"></main>
  </section>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p class="error" id="modal-error"></p>
      <div class="modal-actions">
        <button class="btn ghost" value="cancel" formnovalidate type="button" id="modal-cancel">Cancelar</button>
        <button class="btn primary" id="modal-ok" value="ok" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
