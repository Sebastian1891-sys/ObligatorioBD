services:
  db:
    image: mysql:8.0
    container_name: torneo_ucu_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_torneo_2026}
      MYSQL_DATABASE: torneo_ucu
      TZ: America/Montevideo

    command: ["--default-time-zone=-03:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

      - ./base_de_datos/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./base_de_datos/logica.sql:/docker-entrypoint-initdb.d/02-logica.sql:ro
      - ./base_de_datos/usuarios.sql:/docker-entrypoint-initdb.d/03-usuarios.sql:ro
      - ./base_de_datos/datos.sql:/docker-entrypoint-initdb.d/04-datos.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: torneo_ucu_app
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: torneo_ucu
      DB_TIME_ZONE: "-03:00"
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-Auth_Torneo_2026!}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-Admin_Torneo_2026!}
      DB_PLANILLERO_PASSWORD: ${DB_PLANILLERO_PASSWORD:-Planillero_Torneo_2026!}
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
