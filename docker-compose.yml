
services:
  db:
    image: mysql:8.0
    container_name: torneo_ucu_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: torneo_ucu

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./base_de_datos/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro

volumes:
  mysql_data:
